name: Deploy

# Reusable workflow: runs `aspire deploy` against a Scaleway environment. Aspire's pipeline does
# Build → Push (to Scaleway Container Registry) → our ScalewayPipelineStep (provision infra +
# deploy containers). EnvironmentProfile.Resolve() reads APPHOST_ENVIRONMENT to pick sizing,
# domain, budget, and OAuth/Stripe mock flags per env.
#
# Migration ordering is the orchestrator's concern (deploy.yml): it fans out per-SCS migration
# jobs before this workflow runs, so the schema is current when new containers boot.

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string  # "staging" | "production"
      version:
        required: true
        type: string  # generated by the orchestrator (date-based)

concurrency:
  group: deploy-${{ inputs.environment }}
  # Cancel queued staging runs (newer commit supersedes); never cancel production mid-flight.
  cancel-in-progress: ${{ inputs.environment == 'staging' }}

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment }}
    env:
      APPHOST_ENVIRONMENT: ${{ inputs.environment }}
      SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
      SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
      SCW_DEFAULT_PROJECT_ID: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
      SCW_DEFAULT_REGION: ${{ vars.SCW_DEFAULT_REGION }}
      # SCW_MONTHLY_BUDGET overrides the EnvironmentProfile budget when set; otherwise the
      # profile's value (50 EUR staging, 500 EUR production) is used.
      SCW_MONTHLY_BUDGET: ${{ vars.SCW_MONTHLY_BUDGET }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: application/global.json

      - name: Restore .NET tools
        working-directory: application
        run: dotnet tool restore

      - name: Install Aspire CLI
        run: dotnet tool install --global Aspire.Cli

      - name: Login to Scaleway Container Registry
        # rg.<region>.scw.cloud is the Scaleway Container Registry host; nologin is the
        # documented convention — the actual auth is via the SCW secret key as the password.
        run: |
          echo "${SCW_SECRET_KEY}" | docker login "rg.${SCW_DEFAULT_REGION}.scw.cloud" -u nologin --password-stdin

      - name: Run aspire deploy
        working-directory: application/AppHost
        run: |
          aspire deploy \
            --non-interactive \
            --include-exception-details \
            --nologo \
            -- \
            /p:Version=${{ inputs.version }}
